<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Make a brand video and deck</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f6f6f8;color:#14171a;margin:0;padding:32px 16px}
  main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #dfdfe3;border-radius:8px;padding:24px}
  h1{font-size:20px;margin:0 0 4px} p{color:#555;margin:0 0 16px;line-height:1.45}
  label{display:block;font-weight:600;margin:14px 0 4px;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c8c8cf;border-radius:4px;font-size:15px}
  button{margin-top:18px;background:#14171a;color:#fff;border:0;border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:18px;padding:12px;border-radius:6px;background:#f1f1f4;font-size:14px;line-height:1.5}
  .err{background:#fdecea;color:#8c1d18} .ok{background:#e8f5e9;color:#1b5e20}
  a{color:#0b57d0} .top{margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="top"><a href="/admin/">Back to the content manager</a></div>
  <h1>Make a brand video and deck</h1>
  <p>Reads the store, records the narrated video, builds the PDF deck and publishes the page at /for/&lt;name&gt;. Takes about 4 minutes. You can leave this page open or close it.</p>
  <label for="url">Store address</label><input id="url" placeholder="https://brandstore.com" />
  <label for="name">Brand name</label><input id="name" placeholder="Brand Name" />
  <label for="contact">Contact person (optional)</label><input id="contact" />
  <button id="go">Make video and deck</button>
  <div id="out"></div>
</main>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  function token() {
    try { var u = JSON.parse(localStorage.getItem("decap-cms-user") || localStorage.getItem("netlify-cms-user") || "{}"); return u.token || ""; } catch (e) { return ""; }
  }
  function show(cls, html) { $("out").innerHTML = '<div class="msg ' + cls + '">' + html + "</div>"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  var timer = null;
  function poll(ex, slug, t0) {
    clearInterval(timer);
    timer = setInterval(function () {
      fetch("/api/engine?execution=" + encodeURIComponent(ex), { headers: { Authorization: "Bearer " + token() } })
        .then(function (r) { return r.json(); }).then(function (j) {
          var secs = Math.round((Date.now() - t0) / 1000);
          if (j.error) { show("err", esc(j.error)); return; }
          if (j.state === "running") { show("", "Working, " + secs + " seconds so far..."); return; }
          clearInterval(timer); $("go").disabled = false;
          if (j.state === "done") show("ok", 'Done in ' + secs + ' seconds. The page goes live about a minute after the site redeploys: <a href="/for/' + slug + '">/for/' + slug + '</a>');
          else show("err", "The render failed. Open the run log in Google Cloud to see why: run " + esc(ex));
        }).catch(function () {});
    }, 8000);
  }
  $("go").onclick = function () {
    if (!token()) { show("err", 'Sign in at <a href="/admin/">/admin</a> first, then come back.'); return; }
    $("go").disabled = true; show("", "Starting...");
    fetch("/api/engine", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token() },
      body: JSON.stringify({ url: $("url").value, name: $("name").value, contact: $("contact").value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { $("go").disabled = false; show("err", esc(res.j.error || "Could not start.")); return; }
        show("", "Started. Working..."); poll(res.j.execution, res.j.slug, Date.now());
      }).catch(function () { $("go").disabled = false; show("err", "Could not reach the server."); });
  };
})();
</script>
</body>
</html>
